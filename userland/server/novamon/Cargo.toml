[package]
name = "novamon"
version = "2.0.0"
edition = "2021"
authors = ["NovaOS Enterprise Architecture Team"]
description = "Pure Rust Prometheus Telemetry Exporter & Health Metrics Agent (novamon) for NovaOS"

[lib]
name = "novamon"
path = "src/lib.rs"

[[bin]]
name = "novamon"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"
