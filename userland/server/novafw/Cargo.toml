[package]
name = "novafw"
version = "2.0.0"
edition = "2021"
authors = ["NovaOS Enterprise Architecture Team"]
description = "Declarative nftables-inspired Stateful Packet-Filter Firewall CLI (novafw)"

[lib]
name = "novafw"
path = "src/lib.rs"

[[bin]]
name = "novafw"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"
