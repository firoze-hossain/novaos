[package]
name = "novainit"
version = "2.0.0"
edition = "2021"
authors = ["NovaOS Enterprise Architecture Team"]
description = "Cloud-Init & Headless Server Automated Provisioning Engine for NovaOS Server"

[lib]
name = "novainit"
path = "src/lib.rs"

[[bin]]
name = "novainit"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"
