[package]
name = "novactl"
version = "2.0.0"
edition = "2021"
authors = ["NovaOS Enterprise Architecture Team"]
description = "Pure Rust OCI-Compliant Container Runtime Engine (novactl / novadock) with Namespaces & cgroups v2"

[lib]
name = "novactl"
path = "src/lib.rs"

[[bin]]
name = "novactl"
path = "src/main.rs"

[dependencies]
novad = { path = "../novad" }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"
