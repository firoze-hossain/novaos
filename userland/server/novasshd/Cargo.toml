[package]
name = "novasshd"
version = "2.0.0"
edition = "2021"
authors = ["NovaOS Enterprise Architecture Team"]
description = "Pure Rust OpenSSH-Compatible SSH-2 Server Daemon (novasshd) with PTY & SFTP"

[lib]
name = "novasshd"
path = "src/lib.rs"

[[bin]]
name = "novasshd"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"
