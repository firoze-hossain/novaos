[package]
name = "novash"
version = "2.0.0"
edition = "2021"
authors = ["NovaOS Enterprise Architecture Team"]
description = "Modern Interactive Rust Shell (Fish/Zsh-inspired with Syntax Highlighting, Autosuggestions & Git Prompt)"

[dependencies]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"
