[package]
name = "nova-disks"
version = "1.0.0"
edition = "2021"
authors = ["NovaOS Enterprise Architecture Team"]
description = "Sovereign Disks, Partition Manager, SMART Diagnostics & Benchmark Studio for NovaOS"

[dependencies]
stratum-core = { path = "../../../../../stratum/crates/stratum-core" }
stratum-storage = { path = "../../../../../stratum/crates/stratum-storage" }
stratum-render = { path = "../../../../../stratum/crates/stratum-render" }
stratum-ui = { path = "../../../../../stratum/crates/stratum-ui" }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"
