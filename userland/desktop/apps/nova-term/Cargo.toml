[package]
name = "nova-term"
version = "2.0.0"
edition = "2021"
authors = ["NovaOS Enterprise Architecture Team"]
description = "Pro Developer Terminal with GPU Acceleration, 24-bit TrueColor & Split Panes for NovaOS"

[dependencies]
nova-ui = { path = "../../../libs/nova-ui" }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"
