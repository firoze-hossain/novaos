[package]
name = "nova-mail"
version = "1.0.0"
edition = "2021"
authors = ["NovaOS Enterprise Architecture Team"]
description = "Sovereign Pure-Rust Email & Messaging Studio (macOS Mail & Thunderbird Synthesized) for NovaOS"

[dependencies]
hermes-core = { path = "../../../../../hermes/crates/hermes-core" }
hermes-storage = { path = "../../../../../hermes/crates/hermes-storage" }
hermes-render = { path = "../../../../../hermes/crates/hermes-render" }
hermes-ui = { path = "../../../../../hermes/crates/hermes-ui" }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"
