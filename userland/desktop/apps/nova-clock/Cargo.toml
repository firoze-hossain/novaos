[package]
name = "nova-clock"
version = "1.0.0"
edition = "2021"
authors = ["NovaOS Enterprise Architecture Team"]
description = "Sovereign Clock Application (macOS + Ubuntu Synthesized) for NovaOS"

[dependencies]
chronos-core = { path = "../../../../../chronos/crates/chronos-core" }
chronos-ui = { path = "../../../../../chronos/crates/chronos-ui" }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"
