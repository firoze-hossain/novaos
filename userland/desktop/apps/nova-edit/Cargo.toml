[package]
name = "nova-edit"
version = "2.0.0"
edition = "2021"
authors = ["NovaOS Enterprise Architecture Team"]
description = "Fast, Distraction-Free Code & Text Editor with Piece-Table Buffer & Multi-Language Syntax for NovaOS"

[dependencies]
nova-ui = { path = "../../../libs/nova-ui" }
glyph-core = { path = "../../../../../glyph/crates/glyph-core" }
glyph-syntax = { path = "../../../../../glyph/crates/glyph-syntax" }
glyph-ui = { path = "../../../../../glyph/crates/glyph-ui" }
glyph-platform = { path = "../../../../../glyph/crates/glyph-platform" }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"
