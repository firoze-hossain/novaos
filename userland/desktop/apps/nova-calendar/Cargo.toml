[package]
name = "nova-calendar"
version = "2.0.0"
edition = "2021"
authors = ["NovaOS Enterprise Architecture Team"]
description = "Unified Calendar & Event Scheduling App (macOS + Windows 11 + Ubuntu Synthesized) for NovaOS"

[dependencies]
nova-ui = { path = "../../../libs/nova-ui" }
kairos-core = { path = "../../../../../kairos/crates/kairos-core" }
kairos-ui = { path = "../../../../../kairos/crates/kairos-ui" }
kairos-platform = { path = "../../../../../kairos/crates/kairos-platform" }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"
