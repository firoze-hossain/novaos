[package]
name = "nova-files"
version = "2.0.0"
edition = "2021"
authors = ["NovaOS Enterprise Architecture Team"]
description = "Next-Gen File Explorer (Finder + File Explorer Synthesized) for NovaOS"

[dependencies]
nova-ui = { path = "../../../libs/nova-ui" }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"
