# /etc/novafw.conf - NovaOS Advanced Stateful Packet-Filter Firewall Configuration
# Inspired by Linux nftables syntax

table ip filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Accept all loopback traffic
        iif "lo" accept

        # Accept all established and related connections
        ct state established,related accept

        # Accept SSH management
        tcp dport 22 ct state new accept

        # Accept Web traffic
        tcp dport { 80, 443 } ct state new accept

        # Accept WireGuard VPN traffic
        udp dport 51820 ct state new accept

        # Rate-limited ICMP echo requests (mitigate ping floods)
        icmp limit rate 5/second burst 10 accept

        # Drop invalid connection states
        ct state invalid drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        # Forward established/related traffic
        ct state established,related accept

        # Forward traffic from container bridge (nova0) to external WAN (eth0)
        iif "nova0" oif "eth0" accept
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

table ip nat {
    chain prerouting {
        type nat hook prerouting priority -100;

        # Container Port Forwarding: host:8080 -> container 10.88.0.2:80
        tcp dport 8080 dnat to 10.88.0.2:80
    }

    chain postrouting {
        type nat hook postrouting priority 100;

        # Container Masquerade: NAT outbound container subnet traffic to host egress IP
        ip saddr 10.88.0.0/16 oif "eth0" masquerade
    }
}
