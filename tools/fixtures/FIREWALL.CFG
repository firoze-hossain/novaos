# FIREWALL.CFG - the packet filter's rules, read at boot (kernel/net/firewall.c).
# The engine is kernel/rust/firewall.rs; its header comment is the full account.
#
# The stance: nothing gets in unless we asked for it, and what we asked for gets
# back. Connection tracking is what makes "asked for" mean something: a packet
# is NEW, ESTABLISHED (part of a flow the other side has answered), RELATED (an
# ICMP error about a flow, or a TFTP server answering from another port) or
# INVALID. INVALID packets are always dropped, whatever is written here.
#
# Rules are tried in order and the first match wins. No match: the policy.
#
#   rule <accept|drop> <in|out|any> [proto tcp|udp|icmp|any] [from CIDR] [to CIDR]
#        [sport PORTS] [dport PORTS] [state new,established,related]
#        [icmp-type N] [log]
#
# A file that does not parse is rejected whole and the built-in baseline (the
# first three lines below) stays. At most 32 rules.

policy in drop
policy out accept

# replies to what we started, and what that caused
rule accept in state established,related

# the local network may ping us (an echo request is a NEW inbound flow)
rule accept in proto icmp icmp-type 8 from 10.0.2.0/24 state new

# to allow inbound SSH, say:
#   rule accept in proto tcp dport 22 state new log
